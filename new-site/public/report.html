  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {

      background: linear-gradient(160deg, #0f172a 0%, #1e1b4b 60%, #0f172a 100%);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .pw-box {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      padding: 48px 40px 40px;
      text-align: center;

    .pw-box input {
      width: 100%; padding: 12px 16px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 1rem; margin-bottom: 12px; outline: none;
      transition: border-color 0.2s;
    }
    .pw-box input:focus { border-color: #818cf8; }
    .pw-box button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background: #4f46e5; color: #fff; font-size: 0.95rem;
      font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .pw-box button:hover  { background: #4338ca; }
    .pw-box button:disabled { background: #374151; cursor: default; }
    .pw-err { font-size: 0.8rem; color: #f87171; margin-top: 10px; min-height: 18px; }
    .pw-hint { font-size: 0.75rem; color: rgba(255,255,255,0.25); margin-top: 20px; }
  </style>

async function decryptBlob(password) {
  const raw = Uint8Array.from(atob(BLOB), c => c.charCodeAt(0));
  const salt = raw.slice(0, 16);
  const iv   = raw.slice(16, 28);
  const ct   = raw.slice(28);
  const km = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
  );
  try {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    return new TextDecoder().decode(plain);
  } catch (_) { return null; }
}

async function launch(password) {
  const html = await decryptBlob(password);
  if (!html) return false;
  sessionStorage.setItem('fin_pw', password);
  document.open(); document.write(html); document.close();
  return true;
}

// Auto-unlock if same session
const saved = sessionStorage.getItem('fin_pw');
if (saved) {
  launch(saved);
} else {
  const input = document.getElementById('pw-input');
  const btn   = document.getElementById('pw-btn');
  const err   = document.getElementById('pw-err');
  setTimeout(() => input.focus(), 80);

  async function attempt() {
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Decrypting…';
    const ok = await launch(input.value);
    if (!ok) {
      err.textContent = 'Incorrect password — try again';
      input.value = '';
      btn.disabled = false;
      btn.textContent = 'View Report →';
      input.focus();
    }
  }

  input.addEventListener('keydown', e => { if (e.key === 'Enter') attempt(); });
  btn.addEventListener('click', attempt);
}
</script>
