site_name: Novated Lease Guide & Calculator
site_url: https://novatedlease.guide
site_description: Independent, evidence-based guide and calculator for understanding novated leases in Australia, including EV and ICE comparisons, tax effects, risks, and net financial outcomes.
site_author: changyang1230
copyright: |
  <a href="/about/privacy/">Privacy</a> &nbsp;&middot;&nbsp;
  <a href="/about/disclaimer/">Disclaimer</a> &nbsp;&middot;&nbsp;
  <a href="/about/contact/">Contact</a> &nbsp;&middot;&nbsp;
  &copy; 2026 &nbsp;&middot;&nbsp; This site provides general information and educational commentary only.
  It does not constitute personal financial advice.

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sticky-tables.js

extra:
  generator: false

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: custom
      accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.tracking
    - toc.integrate
    - toc.follow

      
markdown_extensions:
  - footnotes
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: docs
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

