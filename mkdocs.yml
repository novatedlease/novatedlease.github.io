site_name: Novated Lease Guide & Calculator
site_url: https://novatedlease.guide
site_description: Independent, evidence-based guide and calculator for understanding novated leases in Australia, including EV and ICE comparisons, tax effects, risks, and net financial outcomes.
site_author: changyang1230
copyright: |
  <a href="/about/privacy/">Privacy</a> &nbsp;&middot;&nbsp;
  <strong>Disclaimer</strong> &middot; This site provides general information and educational commentary only.
  It does not constitute personal financial advice.

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/sticky-tables.js

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.tracking
    - toc.integrate  
    - toc.follow

      
markdown_extensions:
  - footnotes
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md

  - Calculator: calculator/index.md

  - Start here:
      - What is a novated lease, really?: start-here/what-is-novated-lease.md
      - EV vs ICE novated leases compared: start-here/ev-vs-ice-compared.md      
      - Is a novated lease worth it?: start-here/is-it-worth-it.md
      - How to read a novated lease quote?: start-here/how-to-read-a-novated-lease-quote.md
      - How to use the novated lease calculator: start-here/use-nl-calculator.md
      - 20 novated lease calculators reviewed: start-here/calculator-comparison.md

  - Mechanisms explained:
      - Why "tax saved" is the wrong metric: costs-and-savings/why-tax-saved-is-wrong.md
      - Real-life example - How a marketed "$21,320 savings" result in a $5,591 net loss: costs-and-savings/false-saving-example.md
      - Why novated lease interest rates look high: costs-and-savings/why-nl-interest-looks-high.md
      - FBT, RFBA, and adjusted taxable income explained: costs-and-savings/fbt-rfba-ati-explained.md
      - All about residual values: costs-and-savings/why-residual-values-matter.md
