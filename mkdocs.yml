site_name: Novated Lease Guides and Calculator
site_url: https://novatedlease.guide
site_description: Independent, evidence-based explanations of novated leases in Australia
site_author: changyang1230
copyright: |
  <strong>Disclaimer</strong> &middot; This site provides general information and educational commentary only.
  It does not constitute personal financial advice.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.tracking
    - toc.integrate  
    - toc.follow
    

markdown_extensions:
  - footnotes
  - tables
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md

  - Calculator: calculator/index.md

  - Start here:
      - What is a novated lease, really?: start-here/what-is-novated-lease.md
      - EV vs ICE novated leases compared: start-here/ev-vs-ice-compared.md      
      - Is a novated lease right for me?: start-here/is-it-worth-it.md

  - Mechanisms explained:
      - Why "tax saved" is the wrong metric: costs-and-savings/why-tax-saved-is-wrong.md
      - Why novated lease interest rates look high: costs-and-savings/why-nl-interest-looks-high.md
      - FBT, RFBA, and adjusted taxable income explained: costs-and-savings/fbt-rfba-ati-explained.md
      - All about residual values: costs-and-savings/why-residual-values-matter.md
      - How to use the novated lease spreadsheet: costs-and-savings/use-nl-spreadsheet.md

  - Running costs & claiming:
      - Running costs as a "piggy bank": running-costs/running-costs-piggy-bank.md
      - ATO 4.2c per km shortcut: running-costs/ato-42c-per-km-shortcut.md
      - Some employers do not pass on GST saving: running-costs/failure-to-pass-gst-saving.md

  - Risks & exit strategies:
      - Overview: risks/index.md
      - Lease length, residuals, and risk: risks/lease-length-and-risk.md
      - What happens if a novated lease ends early - redundancy, job transfer, vehicle write-off etc: risks/early-termination.md
      - How bad can early termination get - sample calculations: risks/how-bad-can-early-termination-get.md
      - Risk mitigation strategies for early termination risk: risks/risk-mitigation.md

  - Special cases & policy:
      - Overview: special-and-policy/index.md
      - The complicated impact on adjusted taxable income and childcare subsidy: special-and-policy/childcare-subsidy.md
      - FBT-exempt employer and novated lease - don't double count the FBT exemption!: special-and-policy/fbt-exemption-double-counting.md
      - Super guarantee and payroll risks: special-and-policy/super-guarantee.md
      - NSW Health's "Employer Share" - A Special Novated Lease Trap: special-and-policy/nsw-health-employer-share.md
      - EV FBT exemption review timing: special-and-policy/ev-fbt-exemption-review-timing.md
      - Why novated leasing is poorly regulated: special-and-policy/why-poorly-regulated.md

  - About:
      - Who I am and how I became "the novated lease guy": about/about-me.md
      - Disclaimer: about/disclaimer.md